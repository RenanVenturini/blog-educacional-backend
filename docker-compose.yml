version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-educacional-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - database
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    container_name: blog-educacional-db
    environment:
      POSTGRES_DB: blogeducacional
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
