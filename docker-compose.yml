version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-educacional-api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      - database
    restart: unless-stopped

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: blog-educacional-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SuaSenhaForte123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql_data:
