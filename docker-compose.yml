services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-educacional-api
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: '3000'
      # Dentro da rede do Compose o host do banco é o nome do serviço
      DB_SERVER: 'database'
      DB_PORT: '1433'
      DB_USER: '${DB_USER:-sa}'
      DB_PASSWORD: '${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}'
      DB_NAME: '${DB_NAME:-BlogEducacional}'
      JWT_SECRET: '${JWT_SECRET:?defina JWT_SECRET no arquivo .env}'
      JWT_EXPIRES_IN: '${JWT_EXPIRES_IN:-8h}'
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: blog-educacional-db
    environment:
      ACCEPT_EULA: '${ACCEPT_EULA:-Y}'
      MSSQL_SA_PASSWORD: '${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}'
      MSSQL_PID: '${MSSQL_PID:-Developer}'
    ports:
      - '${DB_PORT:-1433}:1433'
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mssql_data:
